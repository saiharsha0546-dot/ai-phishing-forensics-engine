<!DOCTYPE html>
<html>
<head>
    <title>SOC Telemetry Config</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="header">
        <div class="logo"></div>
        <h2>SOC Forensics Telemetry</h2>
    </div>

    <div class="container">
        <label class="switch-container">
            <span class="label-text">Enable Live Telemetry</span>
            <label class="switch">
                <input type="checkbox" id="enableToggle">
                <span class="slider round"></span>
            </label>
        </label>

        <div class="input-group">
            <label for="backendUrl">Backend Server Endpoint</label>
            <input type="text" id="backendUrl" placeholder="e.g. https://your-app.vercel.app">
            <small>Set to your Vercel deployment URL or localhost.</small>
        </div>

        <button id="saveBtn">Update Configuration</button>
        <div id="status"></div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
